[package]
name = "edge-auth"
version = "0.1.0"
description = "OAuth 2.1 authorization server with passkey owner proof for mcp-edge"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "form", "matched-path"] }
base64 = "=0.22.1"
getrandom = "=0.3.4"
hmac = "=0.12.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
url = "=2.5.8"
webauthn-rs = { version = "=0.5.4", default-features = false }
