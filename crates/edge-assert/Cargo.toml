[package]
name = "edge-assert"
version = "0.1.0"
description = "Signed, request-bound edge assertions (Ed25519) for MCP backends behind mcp-edge"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
