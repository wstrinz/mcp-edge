[package]
name = "edge-origin"
version = "0.1.0"
description = "Embeddable origin side of mcp-edge/1: iroh ProtocolHandler, peer admission, assertion checks, app trait"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
edge-assert = { path = "../edge-assert" }
edge-tunnel = { path = "../edge-tunnel" }
bytes = "=1.11.0"
futures-util = { version = "=0.3.31", default-features = false }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
serde_json = "=1.0.145"
tokio = { version = "=1.50.0", features = ["io-util", "sync", "time", "macros", "rt"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }

[dev-dependencies]
base64 = "=0.22.1"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
