[package]
name = "wiskit-edge-poc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "=1.0.100"
bytes = "=1.11.0"
futures-util = "=0.3.31"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.19", features = ["tokio", "server", "http1"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["stream", "json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
socket2 = "=0.6.1"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }

[profile.dev]
debug = 0
