[workspace]
members = [".", "crates/edge-assert", "crates/edge-auth", "crates/edge-tunnel", "crates/edge-origin"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.93"
publish = false

[package]
name = "mcp-edge"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
edge-assert = { path = "crates/edge-assert" }
edge-auth = { path = "crates/edge-auth" }
# Phase 4: the iroh tunnel client (pins iroh =1.3.0, default features off, tls-ring).
edge-tunnel = { path = "crates/edge-tunnel" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "matched-path", "original-uri"] }
bytes = "=1.11.0"
futures-util = { version = "=0.3.31", default-features = false }
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.19", features = ["tokio", "server", "http1", "service"] }
# HTTP forwarder: rustls (ring, webpki roots), HTTP/1.1 only, no proxies, no compression.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }
toml = { version = "=0.9.10", default-features = false, features = ["std", "serde", "parse"] }
tower = { version = "=0.5.2", default-features = false, features = ["util"] }
url = "=2.5.8"

[dev-dependencies]
# In-test fake origin (loopback iroh, relays off).
edge-origin = { path = "crates/edge-origin" }
base64 = "=0.22.1"
getrandom = "=0.3.4"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
webauthn-authenticator-rs = { version = "=0.5.4", default-features = false, features = ["softpasskey"] }

[profile.release]
# No LTO and default codegen units: much lower peak memory and build time on the
# shared Coolify host, for a small service where binary size hardly matters.
lto = false
strip = true

[profile.dev]
debug = 0
