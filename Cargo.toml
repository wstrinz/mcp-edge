[workspace]
members = [".", "crates/edge-assert"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.93"
publish = false

[package]
name = "wiskit-gateway-inert"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bytes = "=1.11.0"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.19", features = ["tokio", "server", "http1"] }
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }

[dev-dependencies]
reqwest = { version = "=0.12.28", default-features = false }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
debug = 0
