[workspace]
members = [".", "crates/edge-assert", "crates/edge-auth"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.93"
publish = false

[package]
name = "mcp-edge"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
edge-assert = { path = "crates/edge-assert" }
edge-auth = { path = "crates/edge-auth" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "matched-path", "original-uri"] }
bytes = "=1.11.0"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.19", features = ["tokio", "server", "http1", "service"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }
toml = { version = "=0.9.10", default-features = false, features = ["std", "serde", "parse"] }
tower = { version = "=0.5.2", default-features = false, features = ["util"] }
url = "=2.5.8"

[dev-dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
webauthn-authenticator-rs = { version = "=0.5.4", default-features = false, features = ["softpasskey"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
debug = 0
