# mcp-edge route table, baked into the image at /etc/mcp-edge/routes.toml.
#
# Kinds: the built-in diagnostic backend (kind = "echo"), HTTP upstreams
# (kind = "http"), both with consent = "edge", and local apps reached over iroh
# (kind = "iroh", always consent = "origin"; PHASE4.md). Unknown keys are
# errors. See README.md ("Adding an HTTP backend", "Wiskit over iroh") first.

[[backend]]
id = "echo"                  # path segment and assertion audience: /echo/mcp
kind = "echo"
consent = "edge"
display_name = "Echo (diagnostic)"
scopes = ["mcp"]
grant_lifetime_secs = 86400  # absolute grant lifetime; refresh never extends it
max_request_bytes = 65536

# Hevy (wstrinz/hevy-mcp, edge mode): the upstream verifies Edge-Assertion
# (aud = "hevy", req over method + "/mcp" + body) and refuses anything else.
[[backend]]
id = "hevy"                               # public URL: https://<edge>/hevy/mcp
kind = "http"
consent = "edge"
display_name = "Hevy"
url = "https://hevy-mcp.app.stri.nz/mcp"  # exact upstream; signed path is /mcp
max_request_bytes = 1048576
max_response_bytes = 4194304
connect_timeout_secs = 5
response_timeout_secs = 20                # time to response headers (<= 25)
idle_timeout_secs = 60                    # longest gap between body chunks
max_concurrent_per_grant = 4              # in-flight requests + open streams

# Wiskit on the home PC over iroh (phase 4). DISABLED: uncomment only after
# the owner has set the Coolify secret EDGE_ORIGIN_WISKIT to the app's own
# EndpointId (64 lowercase hex, shown in Wiskit under Remote access) and the
# Wiskit build with remote access exists. With this entry enabled, a missing
# or malformed EDGE_ORIGIN_WISKIT stops the edge at startup (no silent
# fallback). The EndpointId never goes into git; only the variable name does.
#
# [[backend]]
# id = "wiskit"                        # public URL: https://<edge>/wiskit/mcp
# kind = "iroh"
# consent = "origin"                   # the app decides trackers and lifetime
# display_name = "Wiskit (home PC)"
# scopes = ["wiskit:read"]
# grant_lifetime_secs = 86400          # trial ceiling; the owner picks <= this in the app
# max_request_bytes = 65536            # <= 64 KiB (tunnel cap)
# max_response_bytes = 1048576         # <= 1 MiB (tunnel cap)
# origin_endpoint_env = "EDGE_ORIGIN_WISKIT"   # must start with EDGE_ORIGIN_
